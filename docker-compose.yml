services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shopsphere
      POSTGRES_USER: shopsphere
      POSTGRES_PASSWORD: shopsphere
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopsphere -d shopsphere"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://shopsphere:shopsphere@db:5432/shopsphere
      SECRET_KEY: change-this-in-production
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  market-updater:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://shopsphere:shopsphere@db:5432/shopsphere
      SECRET_KEY: change-this-in-production
      CORS_ORIGINS: http://localhost:5173
    command: ["python", "-m", "app.services.market_updater"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    ports: ["5173:80"]
    depends_on:
      - api

volumes:
  pgdata:
